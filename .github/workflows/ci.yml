name: iOS quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install quality tools
        run: brew install xcodegen swiftlint swiftformat
      - name: Toolchain
        run: xcodebuild -version
      - name: Core tests
        run: swift test
      - name: SwiftLint
        run: swiftlint lint --strict --no-cache
      - name: SwiftFormat
        run: swiftformat . --lint --cache ignore
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app and widgets
        run: xcodebuild -project IncidentAI.xcodeproj -scheme IncidentAI -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Select an available simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Native view model tests
        run: xcodebuild -project IncidentAI.xcodeproj -scheme IncidentAI -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO test
      - name: Build watch companion
        run: xcodebuild -project IncidentAI.xcodeproj -target IncidentAIWatch -sdk watchos -configuration Debug SYMROOT=$PWD/build-watch/Products OBJROOT=$PWD/build-watch/Intermediates CODE_SIGNING_ALLOWED=NO build
