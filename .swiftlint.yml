excluded:
  - .build
  - build
  - DerivedData
  - IncidentAI.xcodeproj
line_length:
  warning: 180
  error: 260
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
function_body_length:
  warning: 120
  error: 180
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 650
  error: 800
identifier_name:
  min_length: 2
  excluded: [id, x, y]
disabled_rules:
  - trailing_comma
  - opening_brace
  - multiple_closures_with_trailing_closure
  - large_tuple
  - todo

cyclomatic_complexity:
  warning: 15
  error: 20
